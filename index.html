<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Milo's Math Adventure</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c4dff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Milo Math">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --p1:#7c4dff; --p2:#b388ff; --accent:#ff7043; --gold:#ffca28; --green:#66bb6a; --pink:#ff80ab;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; height:100%; overflow:hidden; font-family:'Baloo 2','Trebuchet MS','Comic Sans MS',sans-serif;}
  body{background:linear-gradient(160deg,#8e7bff 0%,#b388ff 45%,#ff9ec7 100%); touch-action:manipulation;}
  #app{position:relative; height:100%; width:100%; max-width:760px; margin:0 auto; overflow:hidden;}
  .screen{position:absolute; inset:0; display:none; flex-direction:column; align-items:center; padding:18px; animation:pop .35s ease;}
  .screen.on{display:flex;}
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}

  h1{color:#fff; font-size:2.2rem; text-align:center; margin:.2em 0; text-shadow:0 3px 0 rgba(0,0,0,.15);}
  .sub{color:#fff; font-size:1.1rem; opacity:.95; text-align:center; margin-bottom:8px;}

  /* MILO mascot */
  .milo{position:relative; width:150px; height:150px; margin:6px auto; cursor:pointer; transition:transform .2s; flex:0 0 auto;}
  .milo.bounce{animation:bounce 1.6s ease-in-out infinite;}
  .milo.cheer{animation:cheer .5s ease;}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  @keyframes cheer{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-6deg)}70%{transform:scale(1.18) rotate(6deg)}100%{transform:scale(1)}}
  .body{position:absolute; inset:0; background:radial-gradient(circle at 35% 30%,#9c64ff,#6a3df0); border-radius:46% 46% 42% 42%; box-shadow:inset 0 -12px 0 rgba(0,0,0,.12), 0 10px 24px rgba(0,0,0,.25);}
  .horn{position:absolute; top:-14px; width:14px; height:26px; background:var(--gold); border-radius:8px;}
  .horn.l{left:46px; transform:rotate(-18deg)} .horn.r{right:46px; transform:rotate(18deg)}
  .eye{position:absolute; top:48px; width:42px; height:42px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center;}
  .eye.l{left:26px} .eye.r{right:26px}
  .pupil{position:relative; width:22px; height:22px; background:#222; border-radius:50%; transition:transform .15s;}
  .pupil::after{content:''; position:absolute; top:3px; right:4px; width:8px; height:8px; background:#fff; border-radius:50%;}
  .mouth{position:absolute; bottom:32px; left:50%; transform:translateX(-50%); width:52px; height:26px; background:#3a1d6e; border-radius:0 0 28px 28px; overflow:hidden;}
  .mouth::after{content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:26px; height:14px; background:#ff5c8d; border-radius:13px 13px 7px 7px;}
  .mouth.think{height:14px; width:30px; border-radius:14px;}
  .cheek{position:absolute; top:88px; width:18px; height:12px; background:var(--pink); border-radius:50%; opacity:.7}
  .cheek.l{left:18px}.cheek.r{right:18px}

  /* Buttons */
  .btn{border:none; border-radius:22px; padding:16px 26px; font-family:inherit; font-weight:800; font-size:1.4rem;
       color:#fff; background:var(--accent); box-shadow:0 6px 0 #c4471f; cursor:pointer; transition:transform .08s, box-shadow .08s; margin:8px;}
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 #c4471f;}
  .btn.green{background:var(--green); box-shadow:0 6px 0 #3f8a43;}
  .btn.purple{background:var(--p1); box-shadow:0 6px 0 #4a2bb0;}
  .btn.big{font-size:1.8rem; padding:20px 44px; border-radius:28px;}

  /* choices grid */
  .choices{display:grid; grid-template-columns:repeat(2,1fr); gap:16px; width:100%; max-width:420px; margin-top:14px;}
  .choice{background:#fff; color:var(--p1); border:none; border-radius:24px; padding:22px; font-family:inherit; font-weight:800;
          font-size:2.6rem; box-shadow:0 6px 0 #d9c9ff; cursor:pointer; transition:transform .1s;}
  .choice:active{transform:scale(.95);}
  .choice.wrong{animation:shake .4s; background:#ffd9d0;}
  .choice.right{background:#c8f0cc; animation:rightpop .4s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @keyframes rightpop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}

  /* objects (fruits) */
  .objbox{background:rgba(255,255,255,.30); border-radius:28px; padding:20px; min-height:230px; width:100%; max-width:520px;
          display:flex; flex-wrap:wrap; gap:16px; align-items:center; justify-content:center; margin-top:6px;}
  .obj{font-size:3.6rem; animation:dropin .4s ease backwards; line-height:1;}
  @keyframes dropin{from{transform:translateY(-30px) scale(.5);opacity:0}to{transform:none;opacity:1}}
  .plus{font-size:3.2rem; color:#fff; font-weight:800; align-self:center;}

  /* top HUD */
  .hud{display:flex; align-items:center; gap:10px; width:100%; max-width:520px; margin-bottom:4px;}
  .xpwrap{flex:1; background:rgba(255,255,255,.35); border-radius:20px; height:26px; overflow:hidden; position:relative;}
  .xpbar{height:100%; width:0; background:linear-gradient(90deg,var(--gold),#ffe082); border-radius:20px; transition:width .5s;}
  .xptxt{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#5a3e00; font-weight:800; font-size:.85rem;}
  .pill{background:#fff; border-radius:20px; padding:6px 12px; font-weight:800; color:var(--accent); font-size:1rem; white-space:nowrap;}

  /* avatar / sticker pickers */
  .grid{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:460px;}
  .pick{font-size:2.6rem; background:#fff; border-radius:20px; padding:10px 14px; cursor:pointer; border:4px solid transparent; transition:transform .1s;}
  .pick.sel{border-color:var(--gold); transform:scale(1.08);} .pick:active{transform:scale(.94);}
  .stickerbook{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; width:100%; max-width:460px; margin-top:10px;}
  .slot{background:rgba(255,255,255,.3); border-radius:18px; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:2.4rem;}
  .slot.empty{opacity:.45; font-size:1.6rem;}

  .speak{background:rgba(255,255,255,.9); border:none; border-radius:50%; width:54px; height:54px; font-size:1.6rem; cursor:pointer; box-shadow:0 4px 0 #d9c9ff; margin-top:6px;}
  .speak:active{transform:translateY(3px);}
  .bubble{background:#fff; color:var(--p1); border-radius:20px; padding:10px 18px; font-weight:700; font-size:1.15rem; max-width:90%; text-align:center; box-shadow:0 4px 10px rgba(0,0,0,.12); margin:4px 0; min-height:24px;}
  .q{color:#fff; font-size:2rem; font-weight:800; text-align:center; margin:6px 0; text-shadow:0 2px 0 rgba(0,0,0,.15);}
  .spacer{flex:1}
  /* confetti */
  .confetti{position:absolute; top:-20px; width:12px; height:12px; opacity:.95; z-index:50; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg); opacity:.7}}
  .row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}

  /* floating playful background */
  .bg{position:absolute; inset:0; overflow:hidden; z-index:0; pointer-events:none;}
  .float{position:absolute; bottom:-40px; font-size:1.8rem; opacity:.35; animation:rise linear infinite;}
  @keyframes rise{to{transform:translateY(-115vh) rotate(40deg); opacity:0}}
  .screen{z-index:1;}

  /* nav buttons (back + music) */
  .navbtn{position:absolute; top:12px; z-index:20; width:50px; height:50px; border:none; border-radius:50%;
          background:rgba(255,255,255,.92); font-size:1.4rem; cursor:pointer; box-shadow:0 4px 0 #d9c9ff; display:none; align-items:center; justify-content:center;}
  .navbtn:active{transform:translateY(3px); box-shadow:0 1px 0 #d9c9ff;}
  #backBtn{left:12px;} #musicBtn{right:12px;}
  .btn.wiggle{animation:wig 2.2s ease-in-out infinite;}
  @keyframes wig{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  #s_welcome h1{margin-top:16px; margin-bottom:2px; font-size:1.85rem;}
  #s_welcome .milo{width:124px; height:124px; margin:2px auto 2px;}
</style>
</head>
<body>
<div id="app">
  <div class="bg" id="bg"></div>
  <button class="navbtn" id="backBtn" onclick="goBack()">⬅️</button>
  <button class="navbtn" id="musicBtn" onclick="toggleMusic()">🎵</button>

  <!-- WELCOME -->
  <div class="screen on" id="s_welcome">
    <h1>Milo's Math Adventure</h1>
    <div class="milo bounce" id="miloWelcome" onclick="say(greetLine())">
      <div class="horn l"></div><div class="horn r"></div>
      <div class="body"></div>
      <div class="eye l"><div class="pupil"></div></div><div class="eye r"><div class="pupil"></div></div>
      <div class="cheek l"></div><div class="cheek r"></div>
      <div class="mouth"></div>
    </div>
    <div class="sub">Pick your buddy!</div>
    <div class="grid" id="avatarGrid"></div>
    <div class="sub" style="margin-top:10px">How big are you?</div>
    <div class="row">
      <button class="btn purple" id="ageLittle" onclick="setAge('little')">🧒 Little (4–5)</button>
      <button class="btn purple" id="ageBig" onclick="setAge('big')">👦 Big (6–8)</button>
    </div>
    <div class="spacer"></div>
    <button class="btn big green" onclick="startGame()">▶ Let's Play!</button>
  </div>

  <!-- GAME -->
  <div class="screen" id="s_game">
    <div class="hud">
      <span class="pill" id="lvlPill">⭐ Lv 1</span>
      <div class="xpwrap"><div class="xpbar" id="xpbar"></div><div class="xptxt" id="xptxt">0/100</div></div>
      <span class="pill" id="streakPill">🔥 0</span>
    </div>
    <div class="milo bounce" id="miloGame" onclick="repeatQ()" style="width:120px;height:120px">
      <div class="horn l"></div><div class="horn r"></div>
      <div class="body"></div>
      <div class="eye l"><div class="pupil"></div></div><div class="eye r"><div class="pupil"></div></div>
      <div class="cheek l"></div><div class="cheek r"></div>
      <div class="mouth" id="miloMouth"></div>
    </div>
    <div class="bubble" id="miloBubble">Let's count!</div>
    <div class="q" id="qtext"></div>
    <div class="objbox" id="objbox"></div>
    <button class="speak" onclick="repeatQ()">🔊</button>
    <div class="choices" id="choices"></div>
    <div class="spacer"></div>
    <div class="row">
      <button class="btn" style="font-size:1rem;padding:10px 18px" onclick="openBook()">🏆 Stickers</button>
    </div>
  </div>

  <!-- STICKER BOOK -->
  <div class="screen" id="s_book">
    <h1>🏆 My Stickers</h1>
    <div class="sub" id="bookCount"></div>
    <div class="stickerbook" id="stickerbook"></div>
    <div class="spacer"></div>
    <button class="btn big green" onclick="show('s_game')">⬅ Back to Play</button>
  </div>

</div>

<script>
// ---------- state ----------
const ST_KEY='milo_math_v1';
const AVATARS=['🦊','🐼','🐯','🦁','🐰','🐸','🐵','🦄'];
const STICKERS=['🌟','🚀','🦕','🍩','🎈','🐙','🌈','⚽','🍦','🦋','🎸','👑','🐳','🍉','🎁','🛸'];
let S = load();

function load(){
  try{ return JSON.parse(localStorage.getItem(ST_KEY)) || fresh(); }catch(e){ return fresh(); }
}
function fresh(){ return {avatar:'🦊', age:'little', xp:0, level:1, streak:0, lastDay:'', correctCount:0, stickers:[]}; }
function save(){ localStorage.setItem(ST_KEY, JSON.stringify(S)); }

// ---------- voice ----------
let VOICE=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  // prefer warm, natural voices; avoid robotic default
  const pref=[/google us english/i,/google uk english female/i,/samantha/i,/aria/i,/jenny/i,/natural/i,/zira/i,/female/i];
  for(const re of pref){ const v=vs.find(x=>/^en/i.test(x.lang)&&re.test(x.name)); if(v){VOICE=v;return;} }
  VOICE = vs.find(v=>/^en/i.test(v.lang)) || vs[0] || null;
}
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=pickVoice; pickVoice(); }
function say(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=0.9; u.pitch=1.08;          // warm + gentle, kid-friendly (was squeaky pitch 1.3)
  if(VOICE) u.voice=VOICE;
  speechSynthesis.speak(u);
}

// ---------- sounds (Web Audio) ----------
let AC=null;
function tone(freq,dur,type='sine',vol=.15){
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=freq;o.connect(g);g.connect(AC.destination);
    g.gain.setValueAtTime(vol,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
    o.start();o.stop(AC.currentTime+dur);
  }catch(e){}
}
const sCorrect=()=>{tone(660,.12);setTimeout(()=>tone(880,.18),120);};
const sWrong=()=>tone(200,.2,'triangle');
const sLevel=()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.2),i*120));};
const sTap=()=>tone(440,.06,'square',.08);

// ---------- screens ----------
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  document.getElementById('backBtn').style.display = (id==='s_welcome')?'none':'flex';
  document.getElementById('musicBtn').style.display = (id==='s_welcome')?'none':'flex';
}
function goBack(){
  sTap();
  const cur=document.querySelector('.screen.on').id;
  if(cur==='s_book') show('s_game');
  else if(cur==='s_game') show('s_welcome');
}

// ---------- soft background music (procedural, pentatonic = always pleasant) ----------
let MUSIC=null, musicOn=false;
const PENTA=[261.63,293.66,329.63,392.00,440.00,523.25,659.25];
function startMusic(){
  if(musicOn || S.music===false) return;
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  if(AC.state==='suspended') AC.resume();
  musicOn=true; updateMusicBtn();
  let step=0;
  MUSIC=setInterval(()=>{
    if(!AC) return;
    const f=PENTA[Math.floor(Math.random()*PENTA.length)] / (step%4===0?2:1); // occasional low note
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(AC.destination);
    const t=AC.currentTime;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.045,t+0.2);          // soft / "silent" volume
    g.gain.exponentialRampToValueAtTime(0.0008,t+1.6);
    o.start(t); o.stop(t+1.7);
    step++;
  }, 760);
}
function stopMusic(){ musicOn=false; if(MUSIC){clearInterval(MUSIC);MUSIC=null;} updateMusicBtn(); }
function toggleMusic(){ sTap(); if(musicOn){ S.music=false; stopMusic(); } else { S.music=true; startMusic(); } save(); }
function updateMusicBtn(){ const b=document.getElementById('musicBtn'); if(b) b.textContent=musicOn?'🎵':'🔇'; }

// ---------- floating background shapes ----------
function buildBg(){
  const bg=document.getElementById('bg'); const ico=['1','2','3','➕','✦','🔢','⭐','🍎','🎈'];
  for(let i=0;i<14;i++){ const s=document.createElement('div'); s.className='float'; s.textContent=ico[i%ico.length];
    s.style.left=Math.random()*100+'%'; s.style.fontSize=(1.3+Math.random()*1.6)+'rem';
    s.style.animationDuration=(9+Math.random()*10)+'s'; s.style.animationDelay=(-Math.random()*12)+'s';
    bg.appendChild(s);
  }
}

// ---------- welcome ----------
function buildAvatars(){
  const g=document.getElementById('avatarGrid'); g.innerHTML='';
  AVATARS.forEach(a=>{
    const d=document.createElement('div'); d.className='pick'+(a===S.avatar?' sel':''); d.textContent=a;
    d.onclick=()=>{ S.avatar=a; save(); buildAvatars(); sTap(); };
    g.appendChild(d);
  });
}
function setAge(a){ S.age=a; save(); sTap();
  document.getElementById('ageLittle').style.outline = a==='little'?'4px solid #ffca28':'none';
  document.getElementById('ageBig').style.outline = a==='big'?'4px solid #ffca28':'none';
}
function greetLine(){ return "Hi! I'm Milo! Let's play with numbers together!"; }

// ---------- game ----------
let cur=null;
function startGame(){ show('s_game'); refreshHUD(); nextQ(); if(S.music!==false) startMusic(); }

function refreshHUD(){
  const need=100;                       // 100 xp = 10 questions per level
  document.getElementById('xpbar').style.width=Math.min(100,(S.xp/need)*100)+'%';
  document.getElementById('xptxt').textContent='❓ '+(S.xp/10)+'/10';   // questions done this level
  document.getElementById('lvlPill').textContent='⭐ Lv '+S.level;
  document.getElementById('streakPill').textContent='🔥 '+S.streak;
}

function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
const ANIMALS=[['🐶','dogs'],['🐱','cats'],['🐰','bunnies'],['🐸','frogs'],['🐥','chicks'],
  ['🐠','fish'],['🦋','butterflies'],['🐢','turtles'],['🐝','bees'],['🐧','penguins'],
  ['🦊','foxes'],['🐨','koalas'],['🐮','cows'],['🦁','lions'],['🐵','monkeys']];
function makeQ(){
  const [f,name]=ANIMALS[randInt(0,ANIMALS.length-1)];
  if(S.age==='little'){               // counting up to 10
    const n=randInt(1,10);
    return {type:'count', f, name, n, answer:n, prompt:`How many ${name} do you see?`, objs:Array(n).fill(f)};
  } else {                            // addition up to 18
    let a=randInt(1,9), b=randInt(1,9);
    return {type:'add', f, name, a, b, answer:a+b, prompt:`What is ${a} plus ${b}?`,
            objs:{a:Array(a).fill(f), b:Array(b).fill(f)}};
  }
}
function options(ans){
  const set=new Set([ans]);
  while(set.size<4){ let d=ans+randInt(-3,3); if(d>=0&&d!==ans) set.add(d); }
  return [...set].sort(()=>Math.random()-.5);
}

function nextQ(){
  cur=makeQ();
  document.getElementById('qtext').textContent = cur.type==='count'? `Count the ${cur.f}!` : `${cur.a} + ${cur.b} = ?`;
  const ob=document.getElementById('objbox'); ob.innerHTML='';
  const addObj=(arr)=>arr.forEach((o,i)=>{const s=document.createElement('span');s.className='obj';s.textContent=o;s.style.animationDelay=(i*0.05)+'s';ob.appendChild(s);});
  if(cur.type==='count'){ addObj(cur.objs); }
  else { addObj(cur.objs.a); const p=document.createElement('span');p.className='plus';p.textContent='➕';ob.appendChild(p); addObj(cur.objs.b); }
  const ch=document.getElementById('choices'); ch.innerHTML='';
  options(cur.answer).forEach(v=>{
    const b=document.createElement('button'); b.className='choice'; b.textContent=v;
    b.onclick=()=>answer(b,v); ch.appendChild(b);
  });
  miloFace('happy');
  setMsg(cur.prompt); say(cur.prompt);
}
function repeatQ(){ if(cur){ say(cur.prompt);} }
function setMsg(t){ document.getElementById('miloBubble').textContent=t; }

function miloFace(mood){
  const m=document.getElementById('miloMouth');
  if(mood==='think'){ m.className='mouth think'; }
  else { m.className='mouth'; }
}

function answer(btn,val){
  if(cur.locked) return;
  if(val===cur.answer){
    cur.locked=true;
    btn.classList.add('right'); sCorrect();
    const milo=document.getElementById('miloGame'); milo.classList.add('cheer'); setTimeout(()=>milo.classList.remove('cheer'),500);
    sparkle(btn);
    const cheers=["Yay! Great job!","Awesome!","You got it!","Super!","Wow, well done!"];
    const c=cheers[randInt(0,cheers.length-1)]; setMsg(c); say(c);
    gainXP(10);
    S.correctCount++; bumpStreak(); save();
    setTimeout(nextQ, 1400);
  } else {
    btn.classList.add('wrong'); sWrong(); miloFace('think');
    setMsg("Almost! Try again 💪"); say("Almost! Try again!");
    setTimeout(()=>btn.classList.remove('wrong'),450);
  }
}

function bumpStreak(){
  const today=new Date().toDateString();
  if(S.lastDay!==today){ S.streak=(S.lastDay? S.streak:0)+1; S.lastDay=today; }
}

function gainXP(n){
  S.xp+=n;
  let need=100;
  while(S.xp>=need){ S.xp-=need; S.level++; need=100; levelUp(); }
  save(); refreshHUD();
}

function levelUp(){
  sLevel(); confetti();
  // unlock a sticker
  const locked=STICKERS.filter(s=>!S.stickers.includes(s));
  if(locked.length){ const st=locked[randInt(0,locked.length-1)]; S.stickers.push(st);
    setTimeout(()=>{ setMsg(`Level ${S.level}! You unlocked ${st}`); say(`Level up! You unlocked a new sticker!`); },300);
  } else { setMsg(`Level ${S.level}! Amazing!`); }
}

// ---------- sticker book ----------
function openBook(){
  show('s_book');
  document.getElementById('bookCount').textContent=`${S.stickers.length} / ${STICKERS.length} collected`;
  const b=document.getElementById('stickerbook'); b.innerHTML='';
  STICKERS.forEach(s=>{ const d=document.createElement('div');
    const got=S.stickers.includes(s);
    d.className='slot'+(got?'':' empty'); d.textContent=got?s:'🔒'; b.appendChild(d); });
}

// ---------- fx ----------
function sparkle(el){
  const r=el.getBoundingClientRect();
  for(let i=0;i<8;i++){ const s=document.createElement('div'); s.textContent='✨'; s.style.position='fixed';
    s.style.left=(r.left+r.width/2)+'px'; s.style.top=(r.top+r.height/2)+'px'; s.style.fontSize='1.4rem'; s.style.zIndex=99; s.style.pointerEvents='none';
    document.body.appendChild(s);
    const ang=Math.random()*6.28, dist=40+Math.random()*50;
    s.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px)`,opacity:0}],{duration:600,easing:'ease-out'});
    setTimeout(()=>s.remove(),650);
  }
}
function confetti(){
  const cols=['#ffca28','#ff7043','#66bb6a','#7c4dff','#ff80ab','#29b6f6'];
  for(let i=0;i<60;i++){ const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'%'; c.style.background=cols[i%cols.length];
    c.style.animationDuration=(1.5+Math.random()*1.5)+'s'; c.style.borderRadius=Math.random()<.5?'50%':'2px';
    document.getElementById('app').appendChild(c); setTimeout(()=>c.remove(),3000);
  }
}

// ---------- eyes follow tap ----------
document.addEventListener('pointerdown',e=>{
  document.querySelectorAll('.pupil').forEach(p=>{
    const r=p.parentElement.getBoundingClientRect();
    const dx=Math.max(-6,Math.min(6,(e.clientX-(r.left+r.width/2))/20));
    const dy=Math.max(-6,Math.min(6,(e.clientY-(r.top+r.height/2))/20));
    p.style.transform=`translate(${dx}px,${dy}px)`;
  });
});

// ---------- init ----------
buildAvatars(); setAge(S.age); buildBg();
document.querySelector('#s_welcome .btn.big.green').classList.add('wiggle');
window.addEventListener('pointerdown',()=>{ if(AC&&AC.state==='suspended')AC.resume(); },{once:true});
// PWA service worker (offline + installable)
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
